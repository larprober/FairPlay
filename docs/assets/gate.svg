<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"
     aria-label="Two independent sources must agree before any feature can run">
  <style>
    .bg   { fill: #14161C; }
    .card { fill: #1E212B; stroke: #2A2F3D; stroke-width: 1.5; }
    .t    { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #EAEEF5; }
    .lbl  { font-size: 15px; font-weight: 600; }
    .sub  { font-size: 12px; fill: #8A93A6; }
    .tag  { font-size: 11px; fill: #8A93A6; }
    .wire { stroke: #4FE3A1; stroke-width: 2; fill: none; }
    .wireOff { stroke: #FF5C5C; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  </style>

  <rect class="bg" width="760" height="300" rx="14"/>

  <!-- source 1 -->
  <rect class="card" x="28" y="42" width="228" height="78" rx="10"/>
  <text class="t lbl" x="46" y="72">1 · The room itself</text>
  <text class="t sub" x="46" y="94">CustomProperties["gameMode"]</text>
  <text class="t sub" x="46" y="110">must contain "MODDED"</text>

  <!-- source 2 -->
  <rect class="card" x="28" y="176" width="228" height="78" rx="10"/>
  <text class="t lbl" x="46" y="206">2 · Utilla</text>
  <text class="t sub" x="46" y="228">[ModdedGamemode] enable edge</text>
  <text class="t sub" x="46" y="244">on the plugin behaviour</text>

  <!-- AND -->
  <path class="wire" d="M256 81 H330 Q346 81 346 100 V140"/>
  <path class="wire" d="M256 215 H330 Q346 215 346 196 V150"/>
  <circle cx="346" cy="150" r="26" fill="#1E212B" stroke="#4FE3A1" stroke-width="2"/>
  <text class="t lbl" x="346" y="156" text-anchor="middle" font-size="13">AND</text>

  <!-- guard -->
  <rect class="card" x="418" y="112" width="150" height="76" rx="10"/>
  <text class="t lbl" x="493" y="142" text-anchor="middle">LobbyGuard</text>
  <text class="t sub" x="493" y="164" text-anchor="middle">fails closed</text>
  <path class="wire" d="M372 150 H418"/>

  <!-- outputs -->
  <path class="wire" d="M568 138 H612"/>
  <rect x="612" y="112" width="120" height="34" rx="8" fill="#246B51"/>
  <text class="t" x="672" y="134" text-anchor="middle" font-size="13" fill="#EAEEF5">features run</text>

  <path class="wireOff" d="M568 168 H612"/>
  <rect x="612" y="152" width="120" height="34" rx="8" fill="#3A1D22" stroke="#FF5C5C" stroke-width="1.5"/>
  <text class="t" x="672" y="174" text-anchor="middle" font-size="13" fill="#FF5C5C">all reverted</text>

  <text class="t tag" x="28" y="286">Either source missing, unreadable, or throwing = closed. There is no single-signal path to open.</text>
</svg>
