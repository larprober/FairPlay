<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FairPlay">
  <defs>
    <linearGradient id="fpShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F3D"/>
      <stop offset="1" stop-color="#14161C"/>
    </linearGradient>
    <linearGradient id="fpPeel" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8CF5C8"/>
      <stop offset="1" stop-color="#3FCE8E"/>
    </linearGradient>
  </defs>

  <!-- shield: everything lives behind the gate -->
  <path d="M32 3.5 58 13.5V33c0 13.4-10.4 22.4-26 27.5C16.4 55.4 6 46.4 6 33V13.5Z"
        fill="url(#fpShield)" stroke="#4FE3A1" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- banana -->
  <path d="M22.6 16.4C16.8 26.6 18.6 38.4 28.2 44.2c4.8 2.9 13.4 3.3 17.8 1.6 2.1-.8 1.8-3.6-.4-3.9-9.4-1.2-15.8-6.4-17.8-15-1-4.4-1.4-8.6-2-11.4-.5-2.4-3.7-3.1-4.8-1.1Z"
        fill="url(#fpPeel)"/>
  <path d="M23.4 14.2 22 10.2" stroke="#3FCE8E" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="45.6" cy="44" r="1.9" fill="#14161C" opacity="0.35"/>

  <!-- latch bar: features stay strapped shut until the lobby says otherwise -->
  <rect x="24" y="49" width="16" height="4" rx="2" fill="#4FE3A1" opacity="0.5"/>
</svg>
